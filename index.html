<title>心内一效期管家</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#2E7D6B;--primary-light:#E8F4F0;--bg:#F4F7F6;--card:#FFFFFF;
  --text:#22302C;--text-sub:#7A8B86;--line:#E7EEEC;
  --danger:#C62828;--urgent:#D9534F;--warn:#E6A23C;--ok:#4CAF6E;
  --radius:14px;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  max-width:520px;margin:0 auto;padding-bottom:90px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* 顶部信息卡片 */
.hero{
  background:linear-gradient(135deg,#2E7D6B 0%,#3E9C85 100%);
  color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 26px;
  border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(46,125,107,.18);
}
.hero .eyebrow{font-size:12px;letter-spacing:.5px;opacity:.85;display:flex;align-items:center;gap:6px;}
.hero .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:#B8E6D8;display:inline-block;}
.hero h1{font-size:19px;font-weight:600;margin-top:8px;line-height:1.35;}
.hero .sub{font-size:13px;opacity:.9;margin-top:6px;display:flex;align-items:center;gap:14px;}
.hero .sub .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.5);}
.hero .inventory{
  margin-top:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:9px 13px;font-size:13px;display:flex;justify-content:space-between;align-items:center;
}
.hero .inventory .tag{background:#fff;color:var(--primary);font-weight:600;font-size:11px;padding:2px 8px;border-radius:20px;}

/* 统计模块 */
.stats{display:flex;gap:10px;margin:-14px 16px 0;position:relative;z-index:2;}
.stat{
  flex:1;background:var(--card);border-radius:var(--radius);padding:14px 6px 12px;
  text-align:center;box-shadow:0 3px 10px rgba(34,48,44,.06);border:2px solid transparent;
  transition:all .15s;cursor:pointer;
}
.stat:active{transform:scale(.94);}
.stat.selected{border-color:var(--primary);background:var(--primary-light);}
.stat .num{font-size:24px;font-weight:700;line-height:1.1;}
.stat .label{font-size:12px;color:var(--text-sub);margin-top:4px;}
.stat.lv-severe .num{color:var(--danger);}
.stat.lv-urgent .num{color:var(--urgent);}
.stat.lv-warn .num{color:var(--warn);}
.stat.lv-ok .num{color:var(--ok);}
.stat .dotbar{height:4px;border-radius:2px;background:var(--bg);margin-top:8px;overflow:hidden;}
.stat .dotbar i{display:block;height:100%;border-radius:2px;transition:width .4s;}
.stat.lv-severe .dotbar i{background:var(--danger);}
.stat.lv-urgent .dotbar i{background:var(--urgent);}
.stat.lv-warn .dotbar i{background:var(--warn);}
.stat.lv-ok .dotbar i{background:var(--ok);}

/* 快捷操作宫格 */
.quick-actions{margin:18px 16px 0;background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 2px 8px rgba(34,48,44,.04);overflow:hidden;}
.quick-actions .qa-header{font-size:13px;font-weight:600;color:var(--text);padding:12px 14px 8px;display:flex;align-items:center;gap:6px;}
.quick-actions .qa-header::before{content:"⚡";font-size:14px;}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);}
.qa-item{
  background:var(--card);padding:14px 4px 12px;text-align:center;cursor:pointer;
  transition:background .15s;display:flex;flex-direction:column;align-items:center;gap:5px;
}
.qa-item:active{background:var(--primary-light);}
.qa-item .qa-icon{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.qa-item .qa-label{font-size:11px;color:var(--text);line-height:1.2;}
.qa-icon.c1{background:#E8F4F0;color:var(--primary);}
.qa-icon.c2{background:#FFF3E0;color:#E68A00;}
.qa-icon.c3{background:#E3F2FD;color:#1976D2;}
.qa-icon.c4{background:#FCE4EC;color:#C62828;}
.qa-icon.c5{background:#F3E5F5;color:#7B1FA2;}
.qa-icon.c6{background:#E0F2F1;color:#00695C;}
.qa-icon.c7{background:#FFF8E1;color:#F57C00;}
.qa-icon.c8{background:#ECEFF1;color:#455A64;}

/* 区块 */
.section{margin:22px 16px 0;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.section-head h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.section-head h2 .badge{font-size:11px;font-weight:500;color:var(--text-sub);background:var(--bg);padding:1px 8px;border-radius:20px;}
.section-head .more{font-size:12px;color:var(--primary);font-weight:500;cursor:pointer;}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 2px 8px rgba(34,48,44,.04);overflow:hidden;}

/* 提醒列表 */
.reminder{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);transition:background .15s;cursor:pointer;}
.reminder:last-child{border-bottom:none;}
.reminder:active{background:var(--primary-light);}
.reminder .mark{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.reminder .info{flex:1;min-width:0;}
.reminder .name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reminder .meta{font-size:12px;color:var(--text-sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.reminder .right{text-align:right;flex-shrink:0;}
.reminder .days{font-size:13px;font-weight:600;}
.reminder .date{font-size:11px;color:var(--text-sub);margin-top:1px;}

.lv-severe .mark,.lv-severe .days{color:var(--danger);}
.lv-urgent .mark,.lv-urgent .days{color:var(--urgent);}
.lv-warn .mark,.lv-warn .days{color:var(--warn);}
.lv-ok .mark,.lv-ok .days{color:var(--ok);}
.lv-severe .mark{background:var(--danger);box-shadow:0 0 0 3px rgba(198,40,40,.12);}
.lv-urgent .mark{background:var(--urgent);box-shadow:0 0 0 3px rgba(217,83,79,.12);}
.lv-warn .mark{background:var(--warn);box-shadow:0 0 0 3px rgba(230,162,60,.15);}
.lv-ok .mark{background:var(--ok);box-shadow:0 0 0 3px rgba(76,175,110,.12);}

.empty{padding:26px 16px;text-align:center;color:var(--text-sub);font-size:13px;}
.empty .icon{font-size:30px;margin-bottom:6px;opacity:.5;}

/* 筛选标签 */
.filter-bar{display:flex;gap:8px;margin:16px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;font-size:12px;padding:7px 16px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);color:var(--text-sub);white-space:nowrap;
  transition:all .15s;cursor:pointer;
}

// ===== 数据层 =====
var STORAGE_KEY = 'expmgr_items_v4';

function loadItems(){
  try{
    var s=localStorage.getItem(STORAGE_KEY);
    if(s!==null){
      var p=JSON.parse(s);
      // 数组（包括空数组，表示已清空库存）都作为有效状态返回
      if(Array.isArray(p)) return p;
    }
  }catch(e){}
  return DEFAULT_ITEMS.slice();
}
function saveItems(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(ITEMS));}catch(e){}}
function loadLogs(){try{var s=localStorage.getItem(LOG_KEY);if(s)return JSON.parse(s);}catch(e){}return [];}
function saveLogs(){try{localStorage.setItem(LOG_KEY,JSON.stringify(LOGS));}catch(e){}}
function loadSettings(){try{var s=localStorage.getItem(SETTINGS_KEY);if(s)return Object.assign({},DEFAULT_SETTINGS,JSON.parse(s));}catch(e){}return Object.assign({},DEFAULT_SETTINGS);}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(SETTINGS));}catch(e){}}

var ITEMS = loadItems();
var LOGS = loadLogs();
var SETTINGS = loadSettings();
var currentFilter = 'all';

// ===== 效期分级 =====
function getDaysLeft(str){var t=new Date();t.setHours(0,0,0,0);var e=new Date(str);e.setHours(0,0,0,0);return Math.round((e-t)/86400000);}
function getLevel(d){if(d<SETTINGS.severeDays)return'severe';if(d<SETTINGS.urgentDays)return'urgent';if(d<=SETTINGS.warningDays)return'warn';return'ok';}
var LEVEL_TEXT={severe:'严重',urgent:'紧急',warn:'预警',ok:'正常',all:'全部','药品':'急救药品','物品':'一次性用物'};

var LOG_TYPES={inbound:'入库',outbound:'出库',inventory:'盘点',restock:'补货',edit:'编辑',check:'检查',delete:'删除',add:'新增'};
var LOG_COLORS={inbound:'#4CAF6E',outbound:'#E68A00',inventory:'#1976D2',restock:'#7B1FA2',edit:'#00695C',check:'#C62828',delete:'#C62828',add:'#4CAF6E'};
function formatDays(d){if(d<0)return'已过期 '+Math.abs(d)+' 天';if(d===0)return'今天到期';return'剩 '+d+' 天';}
function nowStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function addLog(type,detail){LOGS.unshift({type:type,detail:detail,time:nowStr()});if(LOGS.length>200)LOGS=LOGS.slice(0,200);saveLogs();}

// ===== 渲染统计 =====
function renderStats(){
  var c={severe:0,urgent:0,warn:0,ok:0};
  ITEMS.forEach(function(it){c[getLevel(getDaysLeft(it.expire))]++;});
  document.getElementById('cnt-severe').textContent=c.severe;
  document.getElementById('cnt-urgent').textContent=c.urgent;
  document.getElementById('cnt-warn').textContent=c.warn;
  document.getElementById('cnt-ok').textContent=c.ok;
  var total=ITEMS.length||1;
  document.querySelectorAll('.stat').forEach(function(s){
    var lv=s.dataset.filter;var i=s.querySelector('.dotbar i');if(i)i.style.width=(c[lv]/total*100)+'%';
  });
}

  var title=document.getElementById('listTitle');
  var fi=document.getElementById('filterInfo');
  var fit=document.getElementById('filterInfoText');
  var filtered=ITEMS.map(function(it,idx){return{origIdx:idx,name:it.name,cat:it.cat,batch:it.batch,qty:it.qty,expire:it.expire,loc:it.loc,days:getDaysLeft(it.expire),level:getLevel(getDaysLeft(it.expire))};});
  if(currentFilter==='severe')filtered=filtered.filter(function(x){return x.level==='severe';});
  else if(currentFilter==='urgent')filtered=filtered.filter(function(x){return x.level==='urgent';});
  else if(currentFilter==='warn')filtered=filtered.filter(function(x){return x.level==='warn';});
  else if(currentFilter==='ok')filtered=filtered.filter(function(x){return x.level==='ok';});
  else if(currentFilter==='药品')filtered=filtered.filter(function(x){return x.cat==='药品';});
  else if(currentFilter==='物品')filtered=filtered.filter(function(x){return x.cat==='物品';});
  if(sortMode==='expire')filtered.sort(function(a,b){return a.days-b.days;});
  else filtered.sort(function(a,b){return a.name.localeCompare(b.name,'zh');});
  var wc=ITEMS.filter(function(x){return getLevel(getDaysLeft(x.expire))!=='ok';}).length;
  if(currentFilter==='all'){title.innerHTML='效期预警 <span class="badge">'+wc+' 项需处理</span>';}
  else{title.innerHTML=(LEVEL_TEXT[currentFilter]||currentFilter)+' <span class="badge">'+filtered.length+' 项</span>';}
  if(currentFilter!=='all'){fi.style.display='flex';fit.textContent='当前筛选：'+(LEVEL_TEXT[currentFilter]||currentFilter)+'（共 '+filtered.length+' 项）';}
  else{fi.style.display='none';}
  if(filtered.length===0){card.innerHTML='<div class="empty"><div class="icon">✓</div>'+(currentFilter==='all'?'暂无物品':'该分类下暂无物品')+'</div>';return;}
  var html='';
  filtered.forEach(function(it){
    var ct=it.cat==='药品'?'急救药品':'一次性用物';
    var urgentTag=(it.days<=3)?'<span class="urgent-tag">急</span>':'';
    html+='<div class="reminder lv-'+it.level+'" data-idx="'+it.origIdx+'"><span class="mark"></span><div class="info"><div class="name">'+it.name+urgentTag+'</div><div class="meta"><span>'+ct+'</span><span>'+it.batch+'</span><span>'+it.qty+'</span></div></div><div class="right"><div class="days">'+formatDays(it.days)+'</div><div class="date">'+it.expire+'</div></div></div>';
  });
  card.innerHTML=html;
  card.onclick=function(e){var el=e.target.closest('.reminder');if(!el)return;openSheet(parseInt(el.dataset.idx));};
}

// ===== 3天内紧急提醒 =====
function renderAlert(){
  var bar=document.getElementById('alertBar');
  var text=document.getElementById('alertText');
  var urgent=ITEMS.map(function(it,idx){return{name:it.name,days:getDaysLeft(it.expire),qty:it.qty,origIdx:idx};})
    .filter(function(x){return x.days<=3;})
    .sort(function(a,b){return a.days-b.days;});
  if(urgent.length===0){bar.style.display='none';return;}
  var html='';
  urgent.forEach(function(it,i){
    var d=it.days;
    var dayText=d<0?'已过期 '+Math.abs(d)+' 天':(d===0?'今天到期':'剩 '+d+' 天');
    html+='<div>'+(i+1)+'. '+it.name+' <b>'+dayText+'</b>（'+it.qty+'）</div>';
  });
  text.innerHTML=html;
  bar.style.display='flex';
}
document.getElementById('alertClose').addEventListener('click',function(){
  document.getElementById('alertBar').style.display='none';
});

// ===== 详情弹层 =====
var currentSheetIdx=-1;
function openSheet(idx){
  var it=ITEMS[idx];if(!it)return;currentSheetIdx=idx;
  var days=getDaysLeft(it.expire);var lv=getLevel(days);
  document.getElementById('sh-name').textContent=it.name;
  document.getElementById('sh-meta').textContent=(it.cat==='药品'?'急救药品':'一次性用物')+' · '+it.loc;
  var tag=document.getElementById('sh-tag');tag.textContent=LEVEL_TEXT[lv];
  tag.style.background=lv==='severe'?'rgba(198,40,40,.12)':lv==='urgent'?'rgba(217,83,79,.12)':lv==='warn'?'rgba(230,162,60,.15)':'rgba(76,175,110,.12)';
  tag.style.color=LEVEL_COLOR[lv];
  document.getElementById('sh-batch').textContent=it.batch;
  document.getElementById('sh-qty').textContent=it.qty;
  document.getElementById('sh-expire').textContent=it.expire;
  document.getElementById('sh-days').textContent=formatDays(days);
  document.getElementById('sh-days').style.color=LEVEL_COLOR[lv];
  document.getElementById('sh-loc').textContent=it.loc;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){document.getElementById('sheet').classList.remove('show');document.getElementById('overlay').classList.remove('show');}

document.getElementById('sh-close').addEventListener('click',closeSheet);
document.getElementById('sh-outbound').addEventListener('click',function(){
  if(currentSheetIdx<0)return;closeSheet();openOutbound(currentSheetIdx);
});
document.getElementById('sh-edit').addEventListener('click',function(){
  if(currentSheetIdx<0)return;closeSheet();openEdit(currentSheetIdx);
});

// ===== 入库登记 =====
function openInbound(){
  var html='<div class="form-group"><label>物品名称 *</label><input id="ib-name" placeholder="如：一次性无菌注射器 5ml"></div>'
    +'<div class="form-row"><div class="form-group"><label>类别</label><select id="ib-cat"><option value="物品">一次性用物</option><option value="药品">急救药品</option></select></div>'
    +'<div class="form-group"><label>批号</label><input id="ib-batch" placeholder="如：202507A"></div></div>'
    +'<div class="form-row"><div class="form-group"><label>数量</label><input id="ib-qty" placeholder="如：30 支"></div>'
    +'<div class="form-group"><label>有效期至</label><input id="ib-expire" type="date"></div></div>'
    +'<div class="form-group"><label>存放位置</label><input id="ib-loc" placeholder="如：抢救车第3层"></div>';
  openSheet2('📥 入库登记',html,'确认入库',function(){
    var name=document.getElementById('ib-name').value.trim();
    var cat=document.getElementById('ib-cat').value;
    var batch=document.getElementById('ib-batch').value.trim();
    var qty=document.getElementById('ib-qty').value.trim();
    var expire=document.getElementById('ib-expire').value;
    var loc=document.getElementById('ib-loc').value.trim();
    if(!name){showToast('请填写物品名称');return;}
    if(!expire){showToast('请选择有效期');return;}
    if(!qty)qty='1';
    if(!loc)loc='未指定';
    if(!batch)batch='-';
    ITEMS.push({name:name,cat:cat,batch:batch,qty:qty,expire:expire,loc:loc});
    saveItems();addLog('inbound','入库：'+name+'（'+qty+'，有效期至'+expire+'）');
    renderStats();renderList();closeSheet2();showToast('入库成功：'+name);
  });
}

// ===== 出库登记 =====
function openOutbound(idx){
  var it=ITEMS[idx];if(!it)return;
  var html='<div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:14px;">'
    +'<div style="font-weight:600;font-size:15px;">'+it.name+'</div>'
    +'<div style="font-size:12px;color:var(--text-sub);margin-top:4px;">'+(it.cat==='药品'?'急救药品':'一次性用物')+' · '+it.batch+' · 当前库存：'+it.qty+'</div></div>'
    +'<div class="form-group"><label>出库数量</label><input id="ob-num" type="number" min="1" placeholder="如：5"></div>'
    +'<div class="form-group"><label>出库原因</label><select id="ob-reason"><option value="使用消耗">使用消耗</option><option value="过期销毁">过期销毁</option><option value="损坏丢失">损坏丢失</option><option value="调拨转移">调拨转移</option><option value="其他">其他</option></select></div>'
    +'<div class="form-group"><label>备注（选填）</label><textarea id="ob-note" rows="2" placeholder="补充说明"></textarea></div>';
  openSheet2('📤 出库登记',html,'确认出库',function(){
    var num=parseInt(document.getElementById('ob-num').value);
    var reason=document.getElementById('ob-reason').value;
    var note=document.getElementById('ob-note').value.trim();
    if(!num||num<1){showToast('请填写出库数量');return;}
    var m=it.qty.match(/^(\d+)\s*(.*)$/);
    var curNum=m?parseInt(m[1]):0;var unit=m?m[2]:'';
    if(num>curNum){showToast('出库数量超过库存');return;}
    var newNum=curNum-num;
    if(newNum>0){ITEMS[idx].qty=newNum+(unit?' '+unit:'');}
    else{ITEMS.splice(idx,1);}
    saveItems();addLog('outbound','出库：'+it.name+'（'+num+(unit?' '+unit:'')+','+reason+(note?'，'+note:'')+'）');
    renderStats();renderList();closeSheet2();showToast('出库成功');
  });
}

// ===== 检查日期 =====
function openCheckDate(){
  var html='<div class="form-group"><label>检查截止日期</label><input id="cd-date" type="date" value="'+nowStr().split(' ')[0]+'"></div>'
    +'<div style="background:var(--bg);border-radius:10px;padding:12px;font-size:13px;color:var(--text-sub);margin-bottom:14px;">'
    +'系统将检查在该日期前到期的所有物品</div>';
  openSheet2('🔍 检查日期',html,'开始检查',function(){
    var date=document.getElementById('cd-date').value;
    if(!date){showToast('请选择日期');return;}
    var expiring=ITEMS.filter(function(it){return getDaysLeft(it.expire)<=getDaysLeft(date);});
    var html2='<div style="font-size:13px;color:var(--text-sub);margin-bottom:12px;">截至 <b>'+date+'</b>，共 <b style="color:var(--danger);">'+expiring.length+'</b> 项物品到期或即将到期：</div>';
    if(expiring.length===0){html2+='<div class="empty"><div class="icon">✓</div>该日期前无物品到期</div>';}
    else{
      html2+='<div class="log-list">';
      expiring.sort(function(a,b){return getDaysLeft(a.expire)-getDaysLeft(b.expire);});
      expiring.forEach(function(it){
        var d=getDaysLeft(it.expire);var lv=getLevel(d);
        html2+='<div class="log-item"><div class="log-head"><span class="log-type" style="background:'+('rgba(198,40,40,.1)'+';color:'+LEVEL_COLOR[lv])+'">'+LEVEL_TEXT[lv]+'</span><span class="log-time">'+it.expire+'</span></div><div class="log-detail">'+it.name+'（'+it.qty+'，'+formatDays(d)+'）</div></div>';
      });
      html2+='</div>';
    }
    addLog('check','检查日期：截至'+date+'，'+expiring.length+'项到期');
    openSheet2('🔍 检查结果',html2,'',null,true);
    document.getElementById('sheet2Actions').style.display='flex';
    document.getElementById('sheet2Confirm').textContent='知道了';
    document.getElementById('sheet2Confirm').onclick=closeSheet2;
  });
}

// ===== 批量补货 =====
function openRestock(){
  var lowItems=ITEMS.map(function(it,idx){var m=it.qty.match(/^(\d+)/);return{name:it.name,qty:it.qty,num:m?parseInt(m[1]):0,origIdx:idx};}).filter(function(x){return x.num<=5;});
  if(lowItems.length===0){
    openSheet2('📦 批量补货','<div class="empty"><div class="icon">✓</div>当前无低库存物品（库存≤5的物品）</div>','',null,true);
    document.getElementById('sheet2Actions').style.display='flex';
    document.getElementById('sheet2Confirm').textContent='知道了';
    document.getElementById('sheet2Confirm').onclick=closeSheet2;
    return;
  }
  var html='<div style="font-size:13px;color:var(--text-sub);margin-bottom:12px;">以下物品库存较低（≤5），勾选需要补货的物品并填写补货数量：</div>';
  lowItems.forEach(function(it,i){
    html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);">'
      +'<input type="checkbox" id="rs-check-'+i+'" checked style="width:18px;height:18px;">'
      +'<div style="flex:1;"><div style="font-size:14px;font-weight:500;">'+it.name+'</div><div style="font-size:12px;color:var(--text-sub);">当前：'+it.qty+'</div></div>'
      +'<input id="rs-num-'+i+'" type="number" min="1" value="10" style="width:60px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;"></div>';
  });
  openSheet2('📦 批量补货',html,'确认补货',function(){
    var count=0;
    lowItems.forEach(function(it,i){
      var check=document.getElementById('rs-check-'+i);
      if(check&&check.checked){
        var num=parseInt(document.getElementById('rs-num-'+i).value);
        if(!num||num<1)return;
        var m=ITEMS[it.origIdx].qty.match(/^(\d+)\s*(.*)$/);
        var curNum=m?parseInt(m[1]):0;var unit=m?m[2]:'';
        ITEMS[it.origIdx].qty=(curNum+num)+(unit?' '+unit:'');
        addLog('restock','补货：'+it.name+'（+ '+num+(unit?' '+unit:'')+'，现'+ITEMS[it.origIdx].qty+'）');
        count++;
      }
    });
    if(count>0){saveItems();renderList();showToast('已补货 '+count+' 项');closeSheet2();}
    else{showToast('未选择补货物品');}
  });
}

  });
}

// ===== 导出数据 =====
function openExport(){
  var data=JSON.stringify({items:ITEMS,logs:LOGS,settings:SETTINGS,exportTime:nowStr()},null,2);
  var html='<div style="font-size:13px;color:var(--text-sub);margin-bottom:12px;">导出当前全部数据（'+ITEMS.length+' 项物品，'+LOGS.length+' 条记录），可复制保存：</div>'
    +'<textarea readonly style="width:100%;height:200px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:11px;font-family:monospace;background:var(--bg);">'+data+'</textarea>'
    +'<div style="margin-top:10px;text-align:center;font-size:12px;color:var(--text-sub);">长按文本可全选复制</div>';
  openSheet2('💾 导出数据',html,'',null,true);
  document.getElementById('sheet2Actions').style.display='flex';
  document.getElementById('sheet2Confirm').textContent='关闭';
  document.getElementById('sheet2Confirm').onclick=closeSheet2;
}

// ===== 一键出库（清空全部库存）=====
function openClearAll(){
  if(ITEMS.length===0){showToast('库存已为空');return;}
  var html='<div style="background:rgba(198,40,40,.08);border:1px solid rgba(198,40,40,.2);border-radius:10px;padding:14px;margin-bottom:14px;">'
    +'<div style="font-size:14px;font-weight:600;color:var(--danger);margin-bottom:6px;">⚠️ 危险操作</div>'
    +'<div style="font-size:13px;color:var(--text);line-height:1.6;">此操作将清空全部库存（共 <b>'+ITEMS.length+'</b> 项物品），出库后不可恢复，请谨慎操作。</div></div>'
    +'<div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;">'
    +'<div style="font-weight:600;margin-bottom:6px;">出库汇总：</div>'
    +'<div style="color:var(--text-sub);">药品：'+ITEMS.filter(function(x){return x.cat==='药品';}).length+' 项</div>'
    +'<div style="color:var(--text-sub);">物品：'+ITEMS.filter(function(x){return x.cat==='物品';}).length+' 项</div></div>'
    +'<div class="form-group"><label>操作人</label><input id="ca-person" placeholder="请填写操作人姓名"></div>'
    +'<div class="form-group"><label>出库原因</label><select id="ca-reason"><option value="科室搬迁">科室搬迁</option><option value="抢救车更换">抢救车更换</option><option value="批量过期销毁">批量过期销毁</option><option value="年终盘点清零">年终盘点清零</option><option value="其他">其他</option></select></div>'
    +'<div class="form-group"><label>备注（选填）</label><textarea id="ca-note" rows="2" placeholder="补充说明"></textarea></div>';
  openSheet2('🗑️ 一键出库',html,'确认清空',function(){
    var person=document.getElementById('ca-person').value.trim();
    var reason=document.getElementById('ca-reason').value;
    var note=document.getElementById('ca-note').value.trim();
    if(!person){showToast('请填写操作人');return;}
    var count=ITEMS.length;
    var drugCount=ITEMS.filter(function(x){return x.cat==='药品';}).length;
    var supplyCount=count-drugCount;
    addLog('outbound','一键出库：清空全部库存（共'+count+'项，药品'+drugCount+'项，物品'+supplyCount+'项），操作人：'+person+'，原因：'+reason+(note?'，'+note:''));
    ITEMS=[];saveItems();renderStats();renderList();closeSheet2();showToast('已清空全部库存（'+count+' 项）');
  });
}

// ===== 快捷操作绑定 =====
document.querySelector('.qa-grid').addEventListener('click',function(e){
  var item=e.target.closest('.qa-item');if(!item)return;
  var action=item.dataset.action;
  if(action==='inbound')openInbound();
  else if(action==='outbound'){
    if(ITEMS.length===0){showToast('暂无物品');return;}
    openSheet2('📤 出库登记','<div style="font-size:13px;color:var(--text-sub);margin-bottom:12px;">请从列表中点击对应物品进行出库登记</div>','',null,true);
    document.getElementById('sheet2Actions').style.display='flex';
    document.getElementById('sheet2Confirm').textContent='知道了';
    document.getElementById('sheet2Confirm').onclick=closeSheet2;
  }
  else if(action==='inventory')openInventory();
  else if(action==='checkdate')openCheckDate();
  else if(action==='restock')openRestock();
  else if(action==='log')openLog();
  else if(action==='settings')openSettings();
  else if(action==='export')openExport();
  else if(action==='clearall')openClearAll();
});

// ===== 筛选交互 =====
function syncSelection(filter){
  document.querySelectorAll('.chip').forEach(function(c){if(c.dataset.filter===filter)c.classList.add('active');else c.classList.remove('active');});
  document.querySelectorAll('.stat').forEach(function(s){if(s.dataset.filter===filter)s.classList.add('selected');else s.classList.remove('selected');});
  var navPage='overview';if(filter==='药品')navPage='drug';else if(filter==='物品')navPage='supply';
  document.querySelectorAll('.nav a').forEach(function(a){if(a.dataset.page===navPage)a.classList.add('active');else a.classList.remove('active');});
}
document.getElementById('filterBar').addEventListener('click',function(e){
  var chip=e.target.closest('.chip');if(!chip)return;var f=chip.dataset.filter;
  currentFilter=f;syncSelection(f);renderList();showToast('已筛选：'+(LEVEL_TEXT[f]||f));
});
document.querySelectorAll('.stat').forEach(function(s){
  s.addEventListener('click',function(){var f=s.dataset.filter;currentFilter=f;syncSelection(f);renderList();showToast('已筛选：'+(LEVEL_TEXT[f]||f));});
});
document.getElementById('clearFilter').addEventListener('click',function(){currentFilter='all';syncSelection('all');renderList();showToast('已清除筛选');});
document.getElementById('sortBtn').addEventListener('click',function(){
  sortMode=sortMode==='expire'?'name':'expire';
  document.getElementById('sortBtn').textContent=sortMode==='expire'?'按效期排序 ›':'按名称排序 ›';
  renderList();showToast(sortMode==='expire'?'已按效期排序':'已按名称排序');
});

// ===== 底部导航 =====
document.getElementById('nav').addEventListener('click',function(e){
  e.preventDefault();var a=e.target.closest('a');if(!a)return;var page=a.dataset.page;
  if(page==='settings'){openSettings();return;}
  var f='all';if(page==='overview')f='all';else if(page==='drug')f='药品';else if(page==='supply')f='物品';
  currentFilter=f;syncSelection(f);renderList();
});

// ===== Toast =====
var toastTimer;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1500);}

// ===== 更新盘点日期 =====
function updateInventoryDate(){document.getElementById('inventoryDate').textContent=SETTINGS.lastInventory;}
function renderHero(){
  document.getElementById('heroEyebrow').textContent=SETTINGS.dept+'药品及一次性用物管理';
  document.getElementById('heroTitle').innerHTML=SETTINGS.dept+'<br>一次性物品及药品有效期管理';
}

// ===== PWA =====


// ===== 初始化 =====
renderHero();updateInventoryDate();renderStats();renderList();renderAlert();
</script>
<script>
if('serviceWorker' in navigator){
  var swCode = "// service worker - 网络优先策略，确保始终拿到最新版本\nconst CACHE = 'expmgr-v7';\nconst ASSETS = [\n  './index.html',\n  './manifest.json',\n  './icons/icon-192.png',\n  './icons/icon-512.png'\n];\nself.addEventListener('install', e => {\n  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));\n});\nself.addEventListener('activate', e => {\n  e.waitUntil(\n    caches.keys().then(keys => Promise.all(\n      keys.filter(k => k !== CACHE).map(k => caches.delete(k))\n    )).then(() => self.clients.claim())\n  );\n});\n// 网络优先：先请求网络，拿到最新版本；网络失败才回退缓存\nself.addEventListener('fetch', e => {\n  if (e.request.method !== 'GET') return;\n  e.respondWith(\n    fetch(e.request).then(resp => {\n      const copy = resp.clone();\n      caches.open(CACHE).then(c => c.put(e.request, copy));\n      return resp;\n    }).catch(() => caches.match(e.request).then(r => r || caches.match('./index.html')))\n  );\n});\n";
  var blob = new Blob([swCode], {type: 'application/javascript'});
  var swUrl = URL.createObjectURL(blob);
  window.addEventListener('load',function(){
    navigator.serviceWorker.register(swUrl).catch(function(){});
  });
}
</script>
